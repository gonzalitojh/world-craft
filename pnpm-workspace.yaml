# pnpm 12 ya no lee la clave `pnpm` de package.json.
#
# pnpm 12 bloquea por defecto los scripts de instalación de dependencias. Solo
# se autorizan los que el tooling necesita de verdad: `esbuild` descarga o
# enlaza su binario nativo y lo usan Vite y Vitest; `electron` descarga el
# binario del runtime al instalar. Sin esta autorización, `pnpm install` falla
# con `ERR_PNPM_IGNORED_BUILDS`.
allowBuilds:
  electron: true
  esbuild: true
  # Dependencia de electron-builder para el target Squirrel.Windows, que este
  # proyecto no usa: compilamos NSIS. Se declara en falso para que pnpm no
  # ejecute su script de instalación ni bloquee la instalación del paquete.
  electron-winstaller: false

# El producto se distribuye para Windows x64, pero el equipo de desarrollo
# puede ser ARM64 y la CI ejecuta Linux. `current` mantiene las dependencias
# nativas del sistema que ejecuta pnpm (necesario para `verify:native`, tests
# de assets y `sharp` en Ubuntu); `win32` y `x64` añaden el destino de
# empaquetado para poder generar el instalador x64 desde Windows ARM64.
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - x64
    - arm64

# `electron` se fija a una versión recién publicada que la política local de
# antigüedad de pnpm aún no considera madura; se excluye solo esa versión para
# que la instalación con el lockfile sea reproducible.
#
# `maplibre-gl@6.20.0` es la versión aprobada y validada de extremo a extremo en
# el spike de mapas M2-01 (#80, ADR 0033): worker local, CSP estricta, build
# file:// y exportación SVG/PNG. `6.19.0` ya incluye los arreglos de `file://` y
# CJS, pero no se revalidó con Terra Draw, la CSP ni el worker, así que se
# mantiene 6.20.0 con lockfile e integridad exactos (riesgo MEDIUM aceptado).
# Retirar la exclusión cuando la política de antigüedad considere madura la
# versión o, como muy tarde, al abrir M2-02, donde se evalúa bajar a 6.19.0 si
# 6.20.0 no aporta un arreglo imprescindible; si se baja, se revalida el spike.
minimumReleaseAgeExclude:
  - electron@45.3.4
  - maplibre-gl@6.20.0
