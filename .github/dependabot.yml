version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type: chore'
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type: chore'
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
