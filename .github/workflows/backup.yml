name: Backup

# Copia lógica semanal independiente del keep-alive (ADR 0009 §9.3 y ADR 0013).
# El flujo completo —restauración, cifrado de claves y copia en R2— se cierra en
# M5-06 (issue #33); este workflow deja la base operativa sin fingir resultados:
# si faltan los secretos, avisa y no genera ninguna copia.
on:
  schedule:
    # Domingos a las 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar la configuración
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Falta el secreto SUPABASE_DB_URL (pooler de sesión, DIRECT_URL)."
            missing=1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Falta el secreto BACKUP_PASSPHRASE."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            {
              echo "## Backup no configurado"
              echo
              echo "No se ha generado ninguna copia. Configura los secretos \`SUPABASE_DB_URL\` y \`BACKUP_PASSPHRASE\`; el procedimiento está en \`docs/continuidad.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Preparar cliente de PostgreSQL
        if: steps.check.outputs.configured == 'true'
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          pg_dump --version

      - name: Crear, verificar y cifrar la copia
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="world-craft-${timestamp}.dump"
          mkdir -p backup

          # Misma copia lógica que el runbook: esquema public y datos, sin
          # propietarios ni privilegios para que se pueda restaurar en limpio.
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=custom \
            --file="backup/$dump"

          # Una copia que no se puede listar no es una copia.
          pg_restore --list "backup/$dump" > "backup/$dump.list"
          test -s "backup/$dump.list"

          printf '%s' "$BACKUP_PASSPHRASE" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 0 \
                --output "backup/$dump.gpg" "backup/$dump"

          # El volcado en claro no sale del runner.
          rm -f "backup/$dump" "backup/$dump.list"

          test -s "backup/$dump.gpg"
          (cd backup && sha256sum "$dump.gpg" > "$dump.gpg.sha256")

          echo "Copia cifrada: $dump.gpg"
          {
            echo "## Copia semanal completada"
            echo
            echo "- Archivo: \`$dump.gpg\`"
            echo "- Verificación: \`pg_restore --list\` correcta antes de cifrar."
            echo "- Retención del artefacto: 90 días."
            echo "- Descifrado: \`gpg --decrypt $dump.gpg > $dump\` y después \`pg_restore --no-owner --no-privileges\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar la copia cifrada
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-craft-backup
          path: backup/
          retention-days: 90
          if-no-files-found: error
