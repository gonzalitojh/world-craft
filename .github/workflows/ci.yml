# CI de escritorio (issue #69). La caché de pnpm la gestiona
# .github/actions/setup con `cache: pnpm`; en un repo público los runners
# estándar no consumen minutos facturables. El detalle de límites y de la build
# de Windows de M5 está en docs/calidad/plan-de-pruebas.md, sección 6.
name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los jobs lint, typecheck, test y build son los required status checks de
  # `protect-dev` y `protect-main`. No renombrar sus ids ni su `name` sin
  # actualizar scripts/set-branch-protection.ps1 y los rulesets.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Required desde #69. Comprueba que el scaffold compila, que las migraciones
  # son válidas y que los artefactos cumplen la CSP y no cargan contenido
  # remoto.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:check
      - run: pnpm build
      - run: pnpm verify:build

  # No es required: empaquetar NSIS en Windows es lento y la build de release
  # completa llega con M5. Comprueba el instalador, los binarios nativos
  # desempaquetados, latest.yml y los checksums sin publicar nada.
  package:
    name: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify:native
      - run: pnpm dist
      - run: pnpm verify:build
      - run: pnpm package:checksums
      - run: pnpm verify:package -- --installer

  # No es required: un fallo de la acción de secretos no debe bloquear una PR
  # que no toca credenciales. Se revisa en la puerta de seguridad.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # No es required: una vulnerabilidad nueva en una dependencia no debe
  # bloquear una PR que no la toca. Se revisa en la puerta de seguridad.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=high
